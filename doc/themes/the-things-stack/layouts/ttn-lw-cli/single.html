{{ define "main" }}

<div class="container">
  <div class="columns my-0">
    <div class="column is-2 sidebar-left">
      {{ partial "sidebar/side-navigation.html" (.Site.GetPage
      "/concepts/features/cli") }}
    </div>
    <div class="column is-2">
      {{ partial "sidebar/command-side-navigation.html" . }}
    </div>
    <div class="column is-8">
      <div class="docs-content" data-pagefind-body data-pagefind-filter="section:CLI reference">
        <div class="content">{{ .Content }}</div>
        <div data-pagefind-ignore="all">{{ partial "feedback" . }}</div>
      </div>
    </div>
  </div>
</div>

{{ end }}
